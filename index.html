<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174c3c" />
    <meta
      name="description"
      content="ქართული კროსვორდები — პატარა შესვენება, დიდი აღმოჩენები. ითამაშეთ, შეინახეთ პროგრესი და აღმოაჩინეთ ახალი სიტყვები."
    />
    <title>კროსვორდი — ქართული კროსვორდები</title>
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      rel="preload"
      href="./assets/fonts/NotoSansGeorgian-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">მთავარ შიგთავსზე გადასვლა</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="კროსვორდი — მთავარი"
          ><span class="brand-mark" aria-hidden="true"
            ><i>ს</i><i></i><i></i><i>ა</i></span
          ><span
            >კროსვორდი<span class="brand-caption"
              >ქართული კროსვორდები</span
            ></span
          ></a
        >
        <nav aria-label="მთავარი ნავიგაცია">
          <a href="#/" data-nav="home">კროსვორდები</a
          ><a href="#/statistics" data-nav="statistics">სტატისტიკა</a
          ><a href="#/achievements" data-nav="achievements">მიღწევები</a>
        </nav>
        <div class="header-actions">
          <button
            class="icon-button"
            id="theme-button"
            aria-label="თემის შეცვლა"
            title="თემის შეცვლა"
          >
            ◐</button
          ><a
            class="icon-button"
            href="#/settings"
            aria-label="პარამეტრები"
            title="პარამეტრები"
            >⚙︎</a
          >
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading" role="status">
        <span></span>კროსვორდები იტვირთება…
      </div>
    </main>
    <footer class="site-footer">
      <a href="#/" class="footer-brand"
        >კროსვორდი<span>პატარა შესვენება. დიდი აღმოჩენები.</span></a
      >
      <div>
        <button class="text-button" id="help-button">როგორ ვითამაშოთ</button
        ><span>შექმნილია სიტყვების სიყვარულით.</span>
      </div>
    </footer>
    <div id="notifications" aria-live="polite" aria-atomic="true"></div>
    <dialog id="dialog"></dialog>
    <noscript>თამაშისთვის გთხოვთ ჩართოთ JavaScript.</noscript>
  </body>
</html>
